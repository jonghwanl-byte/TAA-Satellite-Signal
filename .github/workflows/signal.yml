name: TAA Satellite Signal

# cron-job.org 가 매일 06:30(KST) 에 workflow_dispatch 를 호출한다.
# (GitHub 자체 schedule 은 지연이 잦아 사용하지 않는다. 필요하면 아래 주석을 해제)
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 21 * * 0-4"   # 21:30 UTC = 06:30 KST (월~금)

concurrency:
  group: taa-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 신호 계산 및 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_VALUE: ${{ secrets.PORTFOLIO_VALUE }}
          ALWAYS_SEND: ${{ vars.ALWAYS_SEND }}
          PRICE_SOURCE: ${{ vars.PRICE_SOURCE }}
        run: python taa_signal.py
