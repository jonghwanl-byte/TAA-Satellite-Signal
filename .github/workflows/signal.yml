name: TAA Satellite Signal

on:
  schedule:
    # 21:43 UTC = 다음날 06:43 KST
    # GitHub 예약 실행은 30분 지연될 수 있어 30분 앞당겨 둡니다.
    # UTC 일~금(0-5) = KST 월~토 → 일요일 수신 제외
    - cron: "43 21 * * 0-5"
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: read

concurrency:
  group: taa-satellite-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import yfinance, pandas; print('yfinance', yfinance.__version__, '| pandas', pandas.__version__)"
          python -c "import pykrx; print('pykrx OK')"

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 선택: 평가액(KRW)을 넣으면 목표 수량(주)까지 계산
          PORTFOLIO_VALUE: ${{ vars.PORTFOLIO_VALUE }}
          # 선택: "false" 로 두면 비중 변동이 있을 때만 전송
          ALWAYS_SEND: ${{ vars.ALWAYS_SEND }}
          # 선택: 소스 우선순위 재정의 (기본 pykrx,history,download)
          PRICE_SOURCE: ${{ vars.PRICE_SOURCE }}
          TZ: Asia/Seoul
        run: python satellite_signal.py
